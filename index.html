<!DOCTYPE html>
<html>
<head>
<title>Para ti :D</title>
<style>
  body {
    display: flex;
    flex-direction: column; /* Apila los elementos verticalmente */
    justify-content: center;
    align-items: center; /* Centra horizontalmente */
    min-height: 100vh; /* Ocupa toda la altura de la ventana */
    margin: 0;
    
    /* Fondo con imagen de flores amarillas */
    background-image: url('https://images.unsplash.com/photo-1651568773893-284763ed694f?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8ZmxvcmVzJTIwYW1hcmlsbGfFufDB8fDB8fHww'); /* URL de las flores para el fondo */
    background-repeat: repeat;
    background-size: auto; 
    
    font-family: Arial, sans-serif;
    text-align: center;
    color: #8b4513; /* Color de texto general */
    position: relative; /* Necesario para posicionar los GIFs de forma absoluta */
  }
  .message {
    font-size: 3em; 
    margin-bottom: 20px;
    background-color: rgba(255, 255, 255, 0.7); /* Fondo semitransparente para el mensaje */
    padding: 15px 30px;
    border-radius: 10px;
  }
  .center-image {
    width: 350px; /* Tamaño de la imagen central, puedes ajustarlo */
    height: auto;
    margin-top: 20px; /* Margen superior para separarlo del mensaje */
    background-color: rgba(255, 255, 255, 0.7); /* Fondo semitransparente para la imagen */
    padding: 20px;
    border-radius: 15px;
  }

  /* Estilos para los GIFs en las esquinas */
  .corner-gif {
    position: absolute;
    width: 80px; /* Tamaño de los GIFs, puedes ajustarlo */
    height: auto;
    z-index: 1000; /* Asegura que los GIFs estén por encima de otros elementos */
  }

  .top-left {
    top: 10px;
    left: 10px;
  }

  .top-right {
    top: 10px;
    right: 10px;
  }

  .bottom-left {
    bottom: 10px;
    left: 10px;
  }

  .bottom-right {
    bottom: 10px;
    right: 10px;
  }
</style>
</head>
<body>
  <div class="message">
    💛🌻 PARA TI LARVA APESTOSOLOROSA tq 🌻💛
  </div>
  
  <!-- Imagen central con la flor, corazón y abejita -->
  <img src="https://resizer.glanacion.com/resizer/v2/el-21-de-septiembre-se-dan-flores-amarillas-en-la-QJUL6ZWUDRGR5P3SXKZADBDM5A.jpg?auth=f83e1971e40e8302038e09331df1d8435fe8e559339405285506c1052c676b76&width=1200&quality=70&smart=false&height=922" alt="Para ti" class="center-image">
  
  <!-- GIFs en las esquinas (usa las URLs de los GIFs que quieras) -->
  <img src="https://i.gifer.com/origin/30/30f66d56833f21d0e620eff7f26e8280_w200.gif" alt="Bailando" class="corner-gif top-left">
  <img src="https://i.gifer.com/origin/30/30f66d56833f21d0e620eff7f26e8280_w200.gif" alt="Bailando" class="corner-gif top-right">
  <img src="https://i.gifer.com/origin/30/30f66d56833f21d0e620eff7f26e8280_w200.gif" alt="Bailando" class="corner-gif bottom-left">
  <img src="https://i.gifer.com/origin/30/30f66d56833f21d0e620eff7f26e8280_w200.gif" alt="Bailando" class="corner-gif bottom-right">
  
</body>
</html>
